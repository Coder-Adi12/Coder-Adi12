<path d="M828 306L856 326L877 375L895 420L876 447L900 470L914 500H955L916 391L885 315Z" fill="#070a11"/>
<!-- rain, kept subtle -->
<g stroke="#8fc7ff" stroke-width="2" stroke-linecap="round" opacity=".35">
 <path d="M123 20l-21 48 M260 95l-18 42 M420 22l-21 49 M558 132l-18 44 M1018 56l-20 48 M1132 143l-19 48 M1404 38l-20 48 M1516 155l-19 47 M180 285l-18 45 M363 220l-20 47 M544 315l-18 46 M1013 250l-21 48 M1185 320l-19 46 M1390 270l-20 48 M1512 368l-19 45">
 <animate attributeName="stroke-dashoffset" from="0" to="95" dur="1.2s" repeatCount="indefinite"/></path>
</g>
<rect x="18" y="18" width="1564" height="464" rx="10" fill="none" stroke="#e3b341" stroke-opacity=".22"/>
<g fill="#e3b341" font-family="monospace" font-size="13" letter-spacing="3" opacity=".76">
<text x="52" y="54">GOTHAM CITY • 02:17 AM</text><text x="1545" y="456" text-anchor="end">SIGNAL ACTIVE</text>
</g>
</svg>